name: tests

on:
  push:
    # a version tag is built and tested by release.yml; it must not start the tests a second time
    tags-ignore: ["**"]
    paths-ignore: ["**.md", "screenshots/**", "docs/**", "wiki/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "screenshots/**", "docs/**", "wiki/**", "LICENSE"]

permissions:
  contents: read

# a newer push to the same branch makes the older run pointless
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # pywebview (optional native window) is not needed for tests
      - name: Install dependencies
        run: python -m pip install "flask>=3.0" pytest
      - name: Run tests
        run: python -m pytest -q
