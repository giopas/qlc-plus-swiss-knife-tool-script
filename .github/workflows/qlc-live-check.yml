name: qlc-live-check

# Opens the generated golden workspaces in a real QLC+ 5.2.2 (headless) and presses every
# button — what no XML check can see (docs/qlc-live-check.md).  The image takes ~25 min to
# build the first time, then comes from the Actions cache.
on:
  push:
    branches: [main]
    paths: ["core/**", "tools/qlc_check.py", "docker/**", "tests/corpus/**", ".github/workflows/qlc-live-check.yml"]
  pull_request:
    paths: ["core/**", "tools/qlc_check.py", "docker/**", "tests/corpus/**", ".github/workflows/qlc-live-check.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # advisory until the first green run on GitHub has been seen (it could only be
    # written, not run, where it was authored)
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: docker/qlc-check
          load: true
          tags: qlc-check:5.2.2
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check the golden workspaces
        run: |
          for f in QuickStart_club QuickStart_multiuni; do
            docker run --rm -v "$PWD":/work qlc-check:5.2.2 \
              python3 tools/qlc_check.py --offscreen "tests/corpus/$f.qxw"
          done
