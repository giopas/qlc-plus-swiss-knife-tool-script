name: release

# On a version tag: build the app for macOS (Apple silicon and Intel), Windows
# and Linux, smoke-test each build, and attach the files + SHA256SUMS to the
# GitHub Release.  Run from sources stays exactly as it is.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14,       label: macos-arm64 }
          - { os: macos-15-intel,  label: macos-x86_64 }
          - { os: windows-latest, label: windows-x64 }
          - { os: ubuntu-22.04,   label: linux-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install "flask>=3.0" pywebview pyinstaller pytest
        shell: bash
      - name: Tests
        run: python -m pytest -q
        shell: bash
      - name: Build
        run: pyinstaller --noconfirm packaging/swissknife.spec
        shell: bash
      - name: Smoke test the bundle
        shell: bash
        run: |
          case "${{ matrix.label }}" in
            macos-*)   EXE="dist/QLC Swiss Knife.app/Contents/MacOS/QLC Swiss Knife" ;;
            windows-*) EXE="dist/QLC Swiss Knife/QLC Swiss Knife.exe" ;;
            linux-*)   EXE="dist/QLC-Swiss-Knife/QLC-Swiss-Knife" ;;
          esac
          "$EXE" --smoke
      - name: Pack
        run: python packaging/make_archive.py
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: release/*

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Checksums
        run: cd files && sha256sum QLC-Swiss-Knife-* > SHA256SUMS && cat SHA256SUMS
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes "See the CHANGELOG."
          gh release upload "$TAG" files/* --repo "$GITHUB_REPOSITORY" --clobber
