name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # pywebview (optional native window) is not needed for tests
      - name: Install dependencies
        run: python -m pip install "flask>=3.0" pytest
      - name: Run tests
        run: python -m pytest -q
