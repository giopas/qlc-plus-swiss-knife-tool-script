name: release

# On a version tag: build the app for macOS (Apple silicon and Intel), Windows
# and Linux, smoke-test each build, and attach the files + SHA256SUMS to the
# GitHub Release.  Run from sources stays exactly as it is.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14,       label: macos-arm64 }
          - { os: macos-15-intel,  label: macos-x86_64 }
          - { os: windows-latest, label: windows-x64 }
          - { os: ubuntu-22.04,   label: linux-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install "flask>=3.0" pywebview certifi pyinstaller pytest
        shell: bash
      - name: Tests
        # the suite assumes POSIX paths / line endings in a few places; tests.yml runs it on Linux
        if: runner.os != 'Windows'
        run: python -m pytest -q
        shell: bash
      - name: Build
        run: pyinstaller --noconfirm packaging/swissknife.spec
        shell: bash
      - name: Smoke test the bundle
        shell: bash
        run: |
          case "${{ matrix.label }}" in
            macos-*)   EXE="dist/QLC Swiss Knife.app/Contents/MacOS/QLC Swiss Knife" ;;
            windows-*) EXE="dist/QLC Swiss Knife/QLC Swiss Knife.exe" ;;
            linux-*)   EXE="dist/QLC-Swiss-Knife/QLC-Swiss-Knife" ;;
          esac
          "$EXE" --smoke
          # Claude talks to the app over stdin/stdout (Windows: the console exe next to it)
          case "${{ matrix.label }}" in
            windows-*) MCP="dist/QLC Swiss Knife/QLC Swiss Knife MCP.exe" ;;
            *)         MCP="$EXE" ;;
          esac
          "$MCP" --mcp --selftest
          echo '{"jsonrpc":"2.0","id":1,"method":"ping"}' | "$MCP" --mcp | grep -q '"result"'
      - name: Inno Setup (Windows installer)
        if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress
        shell: bash
      - name: Pack
        run: python packaging/make_archive.py
        shell: bash
      - name: Test the Windows installer (silent install, start, uninstall)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = (Get-ChildItem release\*-setup.exe).FullName
          $dir = Join-Path $env:RUNNER_TEMP 'swk-install'
          Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$dir" -Wait
          $p = Start-Process "$dir\QLC Swiss Knife.exe" -ArgumentList '--smoke' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "smoke test of the installed app failed ($($p.ExitCode))" }
          if (-not (Test-Path "$dir\unins000.exe")) { throw "no uninstaller" }
          Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT' -Wait
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.label }}
          path: release/*

  publish:
    needs: build
    # publish what was built even if one platform failed (so the others are not lost)
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: files
          merge-multiple: true
      - name: Checksums
        run: cd files && sha256sum QLC-Swiss-Knife-* > SHA256SUMS && cat SHA256SUMS
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes "See the CHANGELOG."
          gh release upload "$TAG" files/* --repo "$GITHUB_REPOSITORY" --clobber
